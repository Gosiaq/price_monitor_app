version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: monitor_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: monitor_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: monitor_worker
    command: celery -A web_monitor worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis